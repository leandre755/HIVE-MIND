# SonarCloud Project Configuration
sonar.projectKey=leandre755_HIVE-MIND
sonar.organization=leandre755

# Source and Test paths
sonar.sources=src
sonar.tests=src/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.d.ts,src/temp/**
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Code Coverage (LCOV generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8
