# Politique interactive : demande confirmation pour tout ce qui n'est pas explicitement "write" ou "allow"
approval_policy = "on-request"
default_permissions = "hive_mind_policy"

[permissions.hive_mind_policy]
description = "Securite stricte pour le projet HIVE-MIND"
extends = ":workspace"

# --- CONFIGURATION DU SYSTEME DE FICHIERS ---
[permissions.hive_mind_policy.filesystem]
# Bloqué formellement (Accès interdit/Aucun)
"/home/omni/Code/HIVE-MIND/.husky/pre-commit" = "none"

# Non listé en écriture totale -> passera par l'interception de "on-request" pour validation
"/home/omni/Code/HIVE-MIND/eslint.config.js" = "read"

# Autorisation totale d'écriture et lecture automatique pour le reste du projet
"/home/omni/Code/HIVE-MIND/**" = "write"


# --- CONFIGURATION DES COMMANDES TERMINAL ---
[permissions.hive_mind_policy.commands]
# Interdiction automatique (Pas d'exécution)
"git commit --no-verify*" = { allow = false }

# Autorisation explicite automatique (Le reste passera par l'invite interactive on-request)
"*" = { allow = true }
