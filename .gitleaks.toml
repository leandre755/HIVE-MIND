# Configuration gitleaks de la Quality Gate locale.
# Invoquée par .githooks/_common/detect-secrets.sh, lui-même appelé par
# .githooks/pre-commit (index) et .githooks/pre-push (historique).
#
# `useDefault = true` conserve l'intégralité des règles natives de gitleaks :
# ce fichier n'en désactive aucune, il n'excipe que le cas documenté ci-dessous.

[extend]
useDefault = true

[allowlist]
description = "Jeton d'exemple factice illustrant le handshake du transport TUI (documentations/tui/reference/core-connection.md, lignes 27 et 52). Les vrais jetons de session vivent dans tui-connection.json, hors de Git."
paths = ['''^documentations/tui/reference/core-connection\.md$''']
